name: QEERI RAG tests
on:
  push:
    paths:
      - 'research/qeeri_rag_v0/**'
      - 'research/greenhouse_llm_feasibility/scientific_case_v0/**'
      - '.github/workflows/qeeri-rag-tests.yml'
  pull_request:
    paths:
      - 'research/qeeri_rag_v0/**'
      - 'research/greenhouse_llm_feasibility/scientific_case_v0/**'
      - '.github/workflows/qeeri-rag-tests.yml'
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/qeeri_rag_v0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run full RAG unit suite
        run: python -W ignore -m unittest discover -s tests -v
      - name: Run bounded greenhouse case tests
        working-directory: research/greenhouse_llm_feasibility/scientific_case_v0
        run: |
          python -m unittest discover -s . -p 'test_*.py' -v
          python evaluate.py > /dev/null
