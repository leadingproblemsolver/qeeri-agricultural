experiments:

  RC01_pad_outlet:
    question_id: "RC01_PAD_OUTLET"
    status: "EXECUTED_AND_VERIFIED_INTERNALLY"
    measurand: "pad_outlet_dry_bulb_temperature_c"
    input_provenance: "synthetic_design_case_not_qatar_verified"
    inputs:
      inlet_dry_bulb_c: 38.0
      inlet_wet_bulb_c: 24.0
      pad_effectiveness: 0.85
    ground_truth_value: 26.1
    scoring_tolerance_c: 0.5
    scientific_uncertainty: "not applicable — deterministic given inputs"
    required_citation:
      source_id: "uf_ifas_ae069"
      passage_id: "ae069_p2_system_efficiency"
    required_reasoning:
      - "must_show_wet_bulb_limit_and_pad_effectiveness"
      - "apply_adiabatic_saturation_effectiveness_formula"
    forbidden_claims:
      - "crop_zone_temperature_without_solar_load_adjustment"
      - "100_percent_pad_effectiveness"
    runs:
      - condition: "A_zero_shot"
        model: "claude-3-5-sonnet-20241022"
        raw_output_path: "research/qeeri_rag_v0/experiments/RC01_A_raw.txt"
        score: "PASS"
      - condition: "B_retrieval"
        status: "SKIPPED — baseline solved from zero-shot, no marginal information"
      - condition: "C_adversarial_framing_noise"
        model: "claude-3-5-sonnet-20241022"
        raw_output_path: "research/qeeri_rag_v0/experiments/RC01_C_raw.txt"
        score: "PASS"
    verdict: "NO_MEASURED_IMPROVEMENT"
    reviewer_sign_off: "pending_human_review"
    limitations:
      - "single_question_single_model_single_run"
      - "near_trivial_for_current_llms"
      - "prompt_c_distractor_was_framing_noise_not_contamination"
      - "input_conditions_synthetic_not_qatar_verified"
    next_action: >
      Move to RC04_CROP_ZONE_ABSTENTION. RC01 cannot discriminate between
      prompt conditions because the baseline model already solves it.

