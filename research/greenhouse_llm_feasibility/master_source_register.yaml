        quote: >
          Q_c,j = max[U_L(T_j - T_sp,max) + τ1 τ2 α S_j, 0]
        supports: "greenhouse_cooling_load_equation_structure"
        measurement_basis: "model"
      - passage_id: "lesotho_p3_table1"
        locator: "Table 1 (p. 3)"
        quote: >
          Maximum Required Temperature T_sp,max (°C): 24
        supports: "tomato_setpoint_reference_range"
        measurement_basis: "assumed_lesotho_specific"
