model_comparison:
  status: NOT_EXECUTED
  arms:
  - A_NO_EVIDENCE
  - B_FIXED_VERIFIED_EVIDENCE
  prerequisites:
  - independently reviewed answer key
  - frozen identical model and prompt
  - raw run receipts
  - independent claim scoring
  no_model_benefit_claim_before_execution: true
limits:
- No invented greenhouse station observations
- No claims of crop death from one pad outlet temperature
- No automatically approved engineering specifications
- Test checks of copied records are not independent confirmation of original sources
- FAO 2013 greenhouse guide excluded under current register policy